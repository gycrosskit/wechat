name: Source regression
on:
  pull_request:
  push:
    branches: [main]
  workflow_dispatch:
    inputs:
      warm_native_cache:
        description: Warm Native toolchains on main only (leave version empty)
        type: boolean
        default: false
permissions:
  contents: read
concurrency:
  group: regression-${{ github.workflow }}-${{ github.event_name }}-${{ github.event.pull_request.number || github.run_id }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}
env:
  CI_FORK_HOST_FALLBACK_IP: ${{ vars.CI_FORK_HOST_FALLBACK_IP }}
  JAVA_TOOL_OPTIONS: -Djava.security.properties=${{ github.workspace }}/scripts/ci-java.security
jobs:
  changes:
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    outputs:
      source: ${{ steps.changes.outputs.source }}
    steps:
      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4.3.1
        with:
          persist-credentials: false
          fetch-depth: 0
      - name: Install shared CI tools
        uses: gycrosskit/.github/actions/ci-tools@607ff44db144c68fc6523de38c04aac29e427b68
      - id: changes
        timeout-minutes: 5
        run: python3 scripts/ci-run.py --log ci-diagnostics/changes.log -- python3 scripts/ci-changes.py
      - name: Save public CI diagnostics
        if: always()
        uses: gycrosskit/.github/actions/ci-diagnostics@607ff44db144c68fc6523de38c04aac29e427b68
        with:
          status: ${{ job.status }}
  contracts:
    needs: changes
    if: always()
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - name: Require successful changes
        timeout-minutes: 1
        env:
          CHECK_RESULT: ${{ needs.changes.result }}
        run: |
          mkdir -p ci-diagnostics
          printf 'Prerequisite result=%s\n' "$CHECK_RESULT" | tee ci-diagnostics/prerequisite.log
          test "$CHECK_RESULT" = success
      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4.3.1
        with:
          persist-credentials: false
      - name: Install shared CI tools
        uses: gycrosskit/.github/actions/ci-tools@607ff44db144c68fc6523de38c04aac29e427b68
      - name: Check CI script syntax on main and docs-only changes
        timeout-minutes: 5
        run: |
          PYTHONPYCACHEPREFIX="$RUNNER_TEMP/ci-pycache" python3 scripts/ci-run.py --log ci-diagnostics/ci-syntax.log -- bash -ec 'python3 -m compileall -q scripts; for script in scripts/*.sh; do bash -n "$script"; done'
      - if: needs.changes.outputs.source == 'true'
        timeout-minutes: 10
        run: |
          python3 scripts/ci-run.py --log ci-diagnostics/contracts-1.log -- python3 verification/ci/test_fork_host.py
          python3 scripts/ci-run.py --log ci-diagnostics/contracts-2.log -- python3 scripts/test-check-maven.py
          python3 scripts/ci-run.py --log ci-diagnostics/contracts-3.log -- python3 scripts/test-jitpack-metadata.py
      - name: Save public CI diagnostics
        if: always()
        uses: gycrosskit/.github/actions/ci-diagnostics@607ff44db144c68fc6523de38c04aac29e427b68
        with:
          status: ${{ job.status }}
  android:
    needs: changes
    if: needs.changes.outputs.source == 'true'
    runs-on: ubuntu-24.04
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4.3.1
        with:
          persist-credentials: false
      - name: Install shared CI tools
        uses: gycrosskit/.github/actions/ci-tools@607ff44db144c68fc6523de38c04aac29e427b68
      - uses: actions/setup-java@c5195efecf7bdfc987ee8bae7a71cb8b11521c00 # v4.7.1
        with:
          distribution: temurin
          java-version: '17'
          cache: gradle
      - run: bash scripts/ci-pin-fork-host.sh
        timeout-minutes: 5
      - run: python3 scripts/ci-run.py --log ci-diagnostics/android-1.log -- bash gradlew --init-script "$PWD/scripts/ci-repositories.gradle" :wechat-core:jvmTest :wechat-core:testDebugUnitTest :wechat-core:compileReleaseKotlinAndroid :wechat-kuikly:compileReleaseKotlinAndroid --no-daemon --max-workers=1 --stacktrace --info
        timeout-minutes: 40
      - name: Save public CI diagnostics
        if: always()
        uses: gycrosskit/.github/actions/ci-diagnostics@607ff44db144c68fc6523de38c04aac29e427b68
        with:
          status: ${{ job.status }}
  native:
    needs: changes
    if: (needs.changes.outputs.source == 'true') || (github.event_name == 'workflow_dispatch' && inputs.warm_native_cache && github.ref == 'refs/heads/main')
    runs-on: macos-15
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4.3.1
        with:
          persist-credentials: false
      - name: Install shared CI tools
        uses: gycrosskit/.github/actions/ci-tools@607ff44db144c68fc6523de38c04aac29e427b68
      - name: Identify Native toolchain and Xcode
        if: (needs.changes.outputs.source == 'true') || (github.event_name == 'workflow_dispatch' && inputs.warm_native_cache && github.ref == 'refs/heads/main')
        id: native-key
        run: python3 scripts/ci-native-cache.py --key >> "$GITHUB_OUTPUT"
      - name: Restore complete Kotlin Native toolchains
        if: (needs.changes.outputs.source == 'true') || (github.event_name == 'workflow_dispatch' && inputs.warm_native_cache && github.ref == 'refs/heads/main')
        id: konan-cache
        uses: actions/cache/restore@0057852bfaa89a56745cba8c7296529d2fc39830 # v4
        with:
          path: |
            ~/.konan/kotlin-native-prebuilt-*
            ~/.konan/dependencies
            !~/.konan/dependencies/cache
            !~/.konan/**/*.part
            !~/.konan/**/*.tmp
            !~/.konan/**/*.lock
          key: ${{ steps.native-key.outputs.key }}
      - uses: actions/setup-java@c5195efecf7bdfc987ee8bae7a71cb8b11521c00 # v4.7.1
        if: (needs.changes.outputs.source == 'true') || (github.event_name == 'workflow_dispatch' && inputs.warm_native_cache && github.ref == 'refs/heads/main')
        with:
          distribution: temurin
          java-version: '17'
          cache: gradle
      - run: bash scripts/ci-pin-fork-host.sh
        if: (needs.changes.outputs.source == 'true') || (github.event_name == 'workflow_dispatch' && inputs.warm_native_cache && github.ref == 'refs/heads/main')
        timeout-minutes: 5
      - run: python3 scripts/ci-run.py --log ci-diagnostics/native-1.log -- bash -ec 'python3 tests/swift-callback.py; python3 tests/swift-receipt.py; python3 verification/swift-kuikly/verify.py'
        if: needs.changes.outputs.source == 'true'
        timeout-minutes: 15
      - timeout-minutes: 40
        if: needs.changes.outputs.source == 'true'
        run: |
          ios_test_target=iosSimulatorArm64Test
          if [[ "$(uname -m)" != arm64 ]]; then ios_test_target=iosX64Test; fi
          python3 scripts/ci-run.py --log ci-diagnostics/native-2.log -- bash gradlew --init-script "$PWD/scripts/ci-repositories.gradle" :wechat-core:"$ios_test_target" :wechat-core:compileKotlinIosArm64 :wechat-core:compileKotlinIosX64 :wechat-core:compileKotlinOhosArm64 :wechat-kuikly:compileKotlinOhosArm64 :wechat-kuikly:compileKotlinIosArm64 :wechat-kuikly:compileKotlinIosX64 :wechat-kuikly:compileKotlinIosSimulatorArm64 --no-daemon --max-workers=1 --stacktrace --info
          python3 -c 'import pathlib, sys, xml.etree.ElementTree as ET; files=pathlib.Path(".").glob("**/build/test-results/"+sys.argv[1]+"/*.xml"); cases=[case for path in files for case in ET.parse(path).iter("testcase")]; assert any(case.find("skipped") is None for case in cases), "No executed iOS test cases"' "$ios_test_target"
      - name: Build native Kuikly receiver with real SDKs
        if: needs.changes.outputs.source == 'true'
        timeout-minutes: 20
        run: |
          python3 scripts/ci-run.py --log ci-diagnostics/native-kuikly-sdk.log -- bash -ec 'render_dir=$(bash scripts/ci-build-kuikly-render.sh "$RUNNER_TEMP/kuikly-native" GycWechatNative/Kuikly); python3 verification/swift-kuikly/verify-public-api.py "$render_dir"'
      - name: Warm trusted main Native cache
        if: (github.event_name == 'workflow_dispatch' && inputs.warm_native_cache && github.ref == 'refs/heads/main') && steps.konan-cache.outputs.cache-hit != 'true'
        timeout-minutes: 40
        run: python3 scripts/ci-run.py --no-progress-seconds 300 --log ci-diagnostics/native-warmup.log -- python3 scripts/ci-native-cache.py
      - name: Save complete Kotlin Native toolchains
        if: success() && ((needs.changes.outputs.source == 'true') || (github.event_name == 'workflow_dispatch' && inputs.warm_native_cache && github.ref == 'refs/heads/main')) && steps.konan-cache.outputs.cache-hit != 'true'
        uses: actions/cache/save@0057852bfaa89a56745cba8c7296529d2fc39830 # v4
        with:
          path: |
            ~/.konan/kotlin-native-prebuilt-*
            ~/.konan/dependencies
            !~/.konan/dependencies/cache
            !~/.konan/**/*.part
            !~/.konan/**/*.tmp
            !~/.konan/**/*.lock
          key: ${{ steps.konan-cache.outputs.cache-primary-key }}
      - name: Save public CI diagnostics
        if: always()
        uses: gycrosskit/.github/actions/ci-diagnostics@607ff44db144c68fc6523de38c04aac29e427b68
        with:
          status: ${{ job.status }}
