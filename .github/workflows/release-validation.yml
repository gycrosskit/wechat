name: Release validation
on:
  pull_request:
  release:
    types: [published]
  workflow_dispatch:
    inputs:
      version:
        description: Immutable Maven release tag
        required: true
        type: string
concurrency:
  group: regression-${{ github.workflow }}-${{ github.event_name }}-${{ github.event.pull_request.number || github.run_id }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}
permissions:
  contents: read
env:
  JAVA_TOOL_OPTIONS: -Djava.security.properties=${{ github.workspace }}/scripts/ci-java.security
  VERSION: ${{ github.event.release.tag_name || inputs.version }}
jobs:
  verify-public:
    if: (github.event_name == 'release' && !startsWith(github.event.release.tag_name, 'native-')) || (github.event_name == 'workflow_dispatch' && inputs.version != '' && !startsWith(inputs.version, 'native-'))
    runs-on: ubuntu-24.04
    timeout-minutes: 25
    env:
      VERSION: ${{ github.event.release.tag_name || inputs.version }}
    steps:
      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4.3.1
        with:
          persist-credentials: false
      - name: Verify immutable archive and public Maven inventory once
        timeout-minutes: 20
        run: python3 scripts/ci-run.py --log ci-diagnostics/verify-public.log -- bash scripts/verify-release.sh
      - name: Save public CI diagnostics
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: ci-${{ github.workflow }}-verify-public-${{ github.run_attempt }}
          path: |
            ci-diagnostics/**/*.log
            ci-diagnostics/**/*.json
            ci-diagnostics/**/*.jsonl
            ci-diagnostics/**/*.txt
            **/build/test-results/**/*.xml
          if-no-files-found: ignore
          retention-days: 7
  release-android:
    needs: verify-public
    if: always() && ((github.event_name == 'release' && !startsWith(github.event.release.tag_name, 'native-')) || (github.event_name == 'workflow_dispatch' && inputs.version != '' && !startsWith(inputs.version, 'native-')))
    runs-on: ubuntu-24.04
    timeout-minutes: 60
    steps:
      - name: Require successful verify-public
        timeout-minutes: 1
        env:
          CHECK_RESULT: ${{ needs.verify-public.result }}
        run: |
          mkdir -p ci-diagnostics
          printf 'Prerequisite result=%s\n' "$CHECK_RESULT" | tee ci-diagnostics/prerequisite.log
          test "$CHECK_RESULT" = success
      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4.3.1
        with:
          persist-credentials: false
      - uses: actions/setup-java@c5195efecf7bdfc987ee8bae7a71cb8b11521c00 # v4.7.1
        with:
          distribution: temurin
          java-version: '17'
          cache: gradle
      - run: bash scripts/ci-pin-fork-host.sh
        timeout-minutes: 5
      - run: python3 scripts/ci-run.py --log ci-diagnostics/release-android-1.log -- bash gradlew --init-script "$PWD/scripts/ci-repositories.gradle" -p verification/gradle "-PwechatVersion=$VERSION"  compileDebugKotlinAndroid --refresh-dependencies --no-daemon --max-workers=1 --stacktrace --info
        timeout-minutes: 40
      - name: Save public CI diagnostics
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: ci-${{ github.workflow }}-release-android-${{ github.run_attempt }}
          path: |
            ci-diagnostics/**/*.log
            ci-diagnostics/**/*.json
            ci-diagnostics/**/*.jsonl
            ci-diagnostics/**/*.txt
            **/build/test-results/**/*.xml
          if-no-files-found: ignore
          retention-days: 7
  release-native:
    needs: verify-public
    if: always() && ((github.event_name == 'release' && !startsWith(github.event.release.tag_name, 'native-')) || (github.event_name == 'workflow_dispatch' && inputs.version != '' && !startsWith(inputs.version, 'native-')))
    runs-on: macos-15
    timeout-minutes: 60
    steps:
      - name: Require successful verify-public
        timeout-minutes: 1
        env:
          CHECK_RESULT: ${{ needs.verify-public.result }}
        run: |
          mkdir -p ci-diagnostics
          printf 'Prerequisite result=%s\n' "$CHECK_RESULT" | tee ci-diagnostics/prerequisite.log
          test "$CHECK_RESULT" = success
      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4.3.1
        with:
          persist-credentials: false
      - name: Restore complete Kotlin Native toolchains
        id: konan-cache
        uses: actions/cache/restore@0057852bfaa89a56745cba8c7296529d2fc39830 # v4
        with:
          path: |
            ~/.konan/kotlin-native-prebuilt-*
            ~/.konan/dependencies
            !~/.konan/dependencies/cache
            !~/.konan/**/*.part
            !~/.konan/**/*.tmp
            !~/.konan/**/*.lock
          key: konan-${{ runner.os }}-${{ runner.arch }}-${{ hashFiles('gradle/libs.versions.toml', '**/gradle.properties', '**/build.gradle.kts', '**/settings.gradle.kts', 'gradle/wrapper/gradle-wrapper.properties') }}
      - uses: actions/setup-java@c5195efecf7bdfc987ee8bae7a71cb8b11521c00 # v4.7.1
        with:
          distribution: temurin
          java-version: '17'
          cache: gradle
      - run: bash scripts/ci-pin-fork-host.sh
        timeout-minutes: 5
      - timeout-minutes: 40
        run: |
          ios_framework_target=IosSimulatorArm64
          if [[ "$(uname -m)" != arm64 ]]; then ios_framework_target=IosX64; fi
          python3 scripts/ci-run.py --log ci-diagnostics/release-native-1.log -- bash gradlew --init-script "$PWD/scripts/ci-repositories.gradle" -p verification/gradle "-PwechatVersion=$VERSION"  "linkDebugFramework$ios_framework_target" compileKotlinIosArm64 compileKotlinIosX64 compileKotlinOhosArm64 --refresh-dependencies --no-daemon --max-workers=1 --stacktrace --info
      - name: Save complete Kotlin Native toolchains
        if: success() && steps.konan-cache.outputs.cache-hit != 'true'
        uses: actions/cache/save@0057852bfaa89a56745cba8c7296529d2fc39830 # v4
        with:
          path: |
            ~/.konan/kotlin-native-prebuilt-*
            ~/.konan/dependencies
            !~/.konan/dependencies/cache
            !~/.konan/**/*.part
            !~/.konan/**/*.tmp
            !~/.konan/**/*.lock
          key: ${{ steps.konan-cache.outputs.cache-primary-key }}
      - name: Save public CI diagnostics
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: ci-${{ github.workflow }}-release-native-${{ github.run_attempt }}
          path: |
            ci-diagnostics/**/*.log
            ci-diagnostics/**/*.json
            ci-diagnostics/**/*.jsonl
            ci-diagnostics/**/*.txt
            **/build/test-results/**/*.xml
          if-no-files-found: ignore
          retention-days: 7
