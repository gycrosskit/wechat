name: Release validation
on:
  pull_request:
  release:
    types: [published]
  workflow_dispatch:
    inputs:
      version:
        description: Immutable Maven or Native release tag
        required: true
        type: string
concurrency:
  group: regression-${{ github.workflow }}-${{ github.event_name }}-${{ github.event.pull_request.number || github.run_id }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}
permissions:
  contents: read
env:
  CI_FORK_HOST_FALLBACK_IP: ${{ vars.CI_FORK_HOST_FALLBACK_IP }}
  JAVA_TOOL_OPTIONS: -Djava.security.properties=${{ github.workspace }}/scripts/ci-java.security
  VERSION: ${{ github.event.release.tag_name || inputs.version }}
jobs:
  verify-public:
    if: (github.event_name == 'release' && !startsWith(github.event.release.tag_name, 'native-')) || (github.event_name == 'workflow_dispatch' && inputs.version != '' && !startsWith(inputs.version, 'native-'))
    runs-on: ubuntu-24.04
    timeout-minutes: 25
    env:
      VERSION: ${{ github.event.release.tag_name || inputs.version }}
    steps:
      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4.3.1
        with:
          persist-credentials: false
      - name: Install shared CI tools
        uses: gycrosskit/.github/actions/ci-tools@607ff44db144c68fc6523de38c04aac29e427b68
      - name: Verify immutable archive and public Maven inventory once
        timeout-minutes: 20
        run: python3 scripts/ci-run.py --log ci-diagnostics/verify-public.log -- bash scripts/verify-release.sh
      - name: Save public CI diagnostics
        if: always()
        uses: gycrosskit/.github/actions/ci-diagnostics@607ff44db144c68fc6523de38c04aac29e427b68
        with:
          status: ${{ job.status }}
  release-android:
    needs: verify-public
    if: always() && ((github.event_name == 'release' && !startsWith(github.event.release.tag_name, 'native-')) || (github.event_name == 'workflow_dispatch' && inputs.version != '' && !startsWith(inputs.version, 'native-')))
    runs-on: ubuntu-24.04
    timeout-minutes: 60
    steps:
      - name: Require successful verify-public
        timeout-minutes: 1
        env:
          CHECK_RESULT: ${{ needs.verify-public.result }}
        run: |
          mkdir -p ci-diagnostics
          printf 'Prerequisite result=%s\n' "$CHECK_RESULT" | tee ci-diagnostics/prerequisite.log
          test "$CHECK_RESULT" = success
      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4.3.1
        with:
          persist-credentials: false
      - name: Install shared CI tools
        uses: gycrosskit/.github/actions/ci-tools@607ff44db144c68fc6523de38c04aac29e427b68
      - uses: actions/setup-java@c5195efecf7bdfc987ee8bae7a71cb8b11521c00 # v4.7.1
        with:
          distribution: temurin
          java-version: '17'
          cache: gradle
      - run: bash scripts/ci-pin-fork-host.sh
        timeout-minutes: 5
      - run: |
          verify_native=$(python3 -c 'import os; v=os.environ["VERSION"].split("-",1)[0]; print(str(tuple(map(int,v.split("."))) >= (0, 1, 8)).lower())')
          python3 scripts/ci-run.py --log ci-diagnostics/release-android-1.log -- bash gradlew --init-script "$PWD/scripts/ci-repositories.gradle" -p verification/gradle "-PwechatVersion=$VERSION" "-PverifyNativeModule=$verify_native"  compileDebugKotlinAndroid --refresh-dependencies --no-daemon --max-workers=1 --stacktrace --info
        timeout-minutes: 40
      - name: Save public CI diagnostics
        if: always()
        uses: gycrosskit/.github/actions/ci-diagnostics@607ff44db144c68fc6523de38c04aac29e427b68
        with:
          status: ${{ job.status }}
  release-native:
    needs: verify-public
    if: always() && ((github.event_name == 'release' && !startsWith(github.event.release.tag_name, 'native-')) || (github.event_name == 'workflow_dispatch' && inputs.version != '' && !startsWith(inputs.version, 'native-')))
    runs-on: macos-15
    timeout-minutes: 60
    steps:
      - name: Require successful verify-public
        timeout-minutes: 1
        env:
          CHECK_RESULT: ${{ needs.verify-public.result }}
        run: |
          mkdir -p ci-diagnostics
          printf 'Prerequisite result=%s\n' "$CHECK_RESULT" | tee ci-diagnostics/prerequisite.log
          test "$CHECK_RESULT" = success
      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4.3.1
        with:
          persist-credentials: false
      - name: Install shared CI tools
        uses: gycrosskit/.github/actions/ci-tools@607ff44db144c68fc6523de38c04aac29e427b68
      - name: Identify Native toolchain and Xcode
        id: native-key
        run: python3 scripts/ci-native-cache.py --key >> "$GITHUB_OUTPUT"
      - name: Restore complete Kotlin Native toolchains
        id: konan-cache
        uses: actions/cache/restore@0057852bfaa89a56745cba8c7296529d2fc39830 # v4
        with:
          path: |
            ~/.konan/kotlin-native-prebuilt-*
            ~/.konan/dependencies
            !~/.konan/dependencies/cache
            !~/.konan/**/*.part
            !~/.konan/**/*.tmp
            !~/.konan/**/*.lock
          key: ${{ steps.native-key.outputs.key }}
      - uses: actions/setup-java@c5195efecf7bdfc987ee8bae7a71cb8b11521c00 # v4.7.1
        with:
          distribution: temurin
          java-version: '17'
          cache: gradle
      - run: bash scripts/ci-pin-fork-host.sh
        timeout-minutes: 5
      - name: Consume exact native receiver Git Pod for new releases
        id: native-receiver
        if: github.event_name == 'release' || (github.event_name == 'workflow_dispatch' && inputs.version != '')
        timeout-minutes: 20
        run: |
          verify_native=$(python3 -c 'import os; v=os.environ["VERSION"].split("-",1)[0]; print(str(tuple(map(int,v.split("."))) >= (0, 1, 8)).lower())')
          if [[ "$verify_native" == true ]]; then
            mkdir -p ci-diagnostics
            render_dir=$(bash scripts/ci-build-kuikly-render.sh "$RUNNER_TEMP/kuikly-native" GycWechatNative/Kuikly wechat native-0.1.8 2> >(tee ci-diagnostics/release-native-kuikly-sdk.log >&2))
            python3 verification/swift-kuikly/verify-public-api.py "$render_dir"
            echo "framework_dir=$render_dir" >> "$GITHUB_OUTPUT"
          fi
      - timeout-minutes: 40
        run: |
          ios_framework_target=IosSimulatorArm64
          if [[ "$(uname -m)" != arm64 ]]; then ios_framework_target=IosX64; fi
          verify_native=$(python3 -c 'import os; v=os.environ["VERSION"].split("-",1)[0]; print(str(tuple(map(int,v.split("."))) >= (0, 1, 8)).lower())')
          python3 scripts/ci-run.py --log ci-diagnostics/release-native-1.log -- bash gradlew --init-script "$PWD/scripts/ci-repositories.gradle" -p verification/gradle "-PwechatVersion=$VERSION" "-PverifyNativeModule=$verify_native" "-PkuiklyRenderFrameworkDir=${{ steps.native-receiver.outputs.framework_dir }}"  "linkDebugFramework$ios_framework_target" compileKotlinIosArm64 compileKotlinIosX64 compileKotlinOhosArm64 --refresh-dependencies --no-daemon --max-workers=1 --stacktrace --info
      - name: Save complete Kotlin Native toolchains
        if: success() && steps.konan-cache.outputs.cache-hit != 'true'
        uses: actions/cache/save@0057852bfaa89a56745cba8c7296529d2fc39830 # v4
        with:
          path: |
            ~/.konan/kotlin-native-prebuilt-*
            ~/.konan/dependencies
            !~/.konan/dependencies/cache
            !~/.konan/**/*.part
            !~/.konan/**/*.tmp
            !~/.konan/**/*.lock
          key: ${{ steps.konan-cache.outputs.cache-primary-key }}
      - name: Save public CI diagnostics
        if: always()
        uses: gycrosskit/.github/actions/ci-diagnostics@607ff44db144c68fc6523de38c04aac29e427b68
        with:
          status: ${{ job.status }}
  native-git-pod:
    if: startsWith(github.event.release.tag_name || inputs.version, 'native-')
    runs-on: macos-15
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4.3.1
        with:
          persist-credentials: false
          ref: ${{ github.event.release.tag_name || inputs.version }}
      - name: Install shared CI tools
        uses: gycrosskit/.github/actions/ci-tools@607ff44db144c68fc6523de38c04aac29e427b68
      - name: Consume exact Native Git Pod and Swift Package
        timeout-minutes: 40
        run: |
          set -euo pipefail
          [[ "$VERSION" =~ ^native-[0-9]+\.[0-9]+\.[0-9]+$ ]] || { echo 'Expected an immutable native tag' >&2; exit 1; }
          build_dir="$RUNNER_TEMP/native-consumer"
          products=$(python3 scripts/ci-run.py --log ci-diagnostics/native-pod.log -- bash scripts/ci-build-kuikly-render.sh "$build_dir" GycWechatNative/Kuikly wechat "$VERSION" | tail -n 1)
          python3 verification/swift-kuikly/verify-public-api.py "$products"
          ruby -r yaml -e 'lock=YAML.load_file(ARGV[0]); abort "Native Pod tag differs" unless lock.fetch("CHECKOUT OPTIONS").fetch("GycWechatNative").fetch(:tag) == ARGV[1]' "$build_dir/Podfile.lock" "$VERSION"
          python3 - "$build_dir/Pods/GycWechatNative" <<'POD_SOURCE'
          from pathlib import Path
          import sys
          remote = Path(sys.argv[1])
          for directory in ('GycWechatNative', 'GycWechatKuikly'):
              for source in (Path('iosApp/Sources') / directory).glob('*.swift'):
                  assert source.read_bytes() == (remote / source).read_bytes(), f'Git Pod source differs: {source}'
          print('Git Pod compiled Native and Kuikly sources match the released checkout')
          POD_SOURCE
          python3 scripts/ci-run.py --log ci-diagnostics/native-spm-resolve.log -- swift package --package-path verification/swift-consumer resolve
          python3 - "$(git rev-parse HEAD)" <<'SPM_IDENTITY'
          import json, sys
          from pathlib import Path
          lock = json.loads(Path('verification/swift-consumer/Package.resolved').read_text())
          pins = [pin for pin in lock['pins'] if pin['identity'] == 'wechat']
          assert len(pins) == 1 and pins[0]['state']['revision'] == sys.argv[1], 'Swift Package resolved a different commit'
          print('Git Pod and Swift Package use the exact released commit')
          SPM_IDENTITY
          sdk=$(xcrun --sdk iphonesimulator --show-sdk-path)
          vendor_dir="$build_dir/Pods/WechatOpenSDK-XCFramework/WechatOpenSDK.xcframework/ios-arm64_x86_64-simulator"
          test -d "$vendor_dir/WechatOpenSDK.framework"
          python3 scripts/ci-run.py --log ci-diagnostics/native-spm-build.log -- swift build --package-path verification/swift-consumer --sdk "$sdk" --triple "$(uname -m)-apple-ios15.0-simulator" -Xswiftc -F -Xswiftc "$vendor_dir" -Xcc "-F$vendor_dir"
      - name: Save public CI diagnostics
        if: always()
        uses: gycrosskit/.github/actions/ci-diagnostics@607ff44db144c68fc6523de38c04aac29e427b68
        with:
          status: ${{ job.status }}
